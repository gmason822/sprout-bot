  <rect x="66" y="210" width="24" height="12" rx="5" fill="#fff4e0" stroke="#7a4a1e" stroke-width="4"/>
  <rect x="128" y="210" width="24" height="12" rx="5" fill="#fff4e0" stroke="#7a4a1e" stroke-width="4"/>
