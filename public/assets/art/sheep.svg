<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- legs -->
  <g fill="#4a4038" stroke="#2b2118" stroke-width="5" stroke-linejoin="round">
    <rect x="68" y="176" width="22" height="46" rx="7"/>
    <rect x="130" y="176" width="22" height="46" rx="7"/>
  </g>
  <!-- woolly body: a ring of puffs with a filled middle -->
  <g fill="#fffdf6" stroke="#8a7f70" stroke-width="5">
    <circle cx="46" cy="140" r="30"/><circle cx="66" cy="108" r="30"/><circle cx="104" cy="94" r="32"/>
    <circle cx="144" cy="104" r="30"/><circle cx="166" cy="140" r="30"/><circle cx="146" cy="172" r="28"/>
    <circle cx="106" cy="182" r="28"/><circle cx="66" cy="172" r="28"/>
  </g>
  <ellipse cx="106" cy="140" rx="66" ry="48" fill="#fffdf6"/>
  <path d="M84 126 q8 -10 16 0 M112 150 q8 -10 16 0 M70 152 q8 -10 16 0" fill="none" stroke="#d8d0c0" stroke-width="4" stroke-linecap="round"/>
  <!-- ears -->
  <ellipse cx="128" cy="92" rx="18" ry="10" fill="#4a4038" stroke="#2b2118" stroke-width="4" transform="rotate(-24 128 92)"/>
  <ellipse cx="218" cy="92" rx="18" ry="10" fill="#4a4038" stroke="#2b2118" stroke-width="4" transform="rotate(24 218 92)"/>
  <!-- face -->
  <ellipse cx="173" cy="104" rx="38" ry="46" fill="#4a4038" stroke="#2b2118" stroke-width="5"/>
  <!-- wool on top of the head -->
  <g fill="#fffdf6" stroke="#8a7f70" stroke-width="5">
    <circle cx="152" cy="62" r="17"/><circle cx="194" cy="62" r="17"/><circle cx="173" cy="52" r="19"/>
  </g>
  <!-- eyes -->
  <circle cx="158" cy="96" r="9" fill="#fff"/><circle cx="160" cy="97" r="5" fill="#2b2118"/>
  <circle cx="188" cy="96" r="9" fill="#fff"/><circle cx="190" cy="97" r="5" fill="#2b2118"/>
  <!-- nose and smile -->
  <path d="M166 122 H180 L173 130 Z" fill="#f9b8c0"/>
  <path d="M173 130 V135 M162 137 Q173 146 184 137" fill="none" stroke="#f9b8c0" stroke-width="4" stroke-linecap="round"/>
</svg>
