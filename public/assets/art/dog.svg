  <rect x="62" y="210" width="26" height="12" rx="5" fill="#fff4e0" stroke="#6b4423" stroke-width="4"/>
  <rect x="128" y="210" width="26" height="12" rx="5" fill="#fff4e0" stroke="#6b4423" stroke-width="4"/>
