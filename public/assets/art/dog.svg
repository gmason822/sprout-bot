  <path d="M166 124 Q174 146 184 124 Z" fill="#f47c8c" stroke="#6b4423" stroke-width="3" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="152" cy="76" r="7" fill="#2b2118"/><circle cx="154" cy="74" r="2.4" fill="#fff"/>
  <circle cx="196" cy="76" r="7" fill="#2b2118"/><circle cx="198" cy="74" r="2.4" fill="#fff"/>
